    <ellipse cx="62" cy="52" rx="34" ry="14" />
    <path d="M28 52 v34 a34 14 0 0 0 68 0 V52" />
    <ellipse cx="138" cy="120" rx="34" ry="14" />
    <path d="M104 120 v34 a34 14 0 0 0 68 0 v-34" />
    <path d="M62 108 C 62 150, 96 138, 104 134" stroke-dasharray="7 8" />
  </g>

  <text x="400" y="352" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="19" font-weight="600" letter-spacing="3.5" fill="#c7d2fe" fill-opacity="0.6">MYSQL  ·  SCHEMA DESIGN  ·  NORMALIZATION</text>

  <rect x="0" y="392" width="800" height="8" fill="url(#bar)" opacity="0.9"/>
