    <rect x="42" y="90" width="116" height="82" rx="14" />
    <path d="M68 90 V66 a32 32 0 0 1 64 0 v24" />
    <circle cx="76" cy="131" r="7" fill="currentColor" stroke="none" />
    <circle cx="100" cy="131" r="7" fill="currentColor" stroke="none" />
    <circle cx="124" cy="131" r="7" fill="currentColor" stroke="none" />
  </g>

  <text x="400" y="352" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="19" font-weight="600" letter-spacing="3.5" fill="#c7d2fe" fill-opacity="0.6">REACT  ·  EXPRESS  ·  MONGODB</text>

  <rect x="0" y="392" width="800" height="8" fill="url(#bar)" opacity="0.9"/>
