<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1d"/>
      <stop offset="100%" stop-color="#131a2e"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <circle cx="150" cy="90" r="260" fill="url(#blobA)"/>
  <circle cx="660" cy="330" r="240" fill="url(#blobB)"/>

  <g transform="translate(300 100) scale(1)" fill="none" stroke="#dbeafe" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round" color="#dbeafe" opacity="0.92">
    <rect x="34" y="34" width="132" height="132" rx="26" />
    <path d="M70 70 L130 130 M130 70 L70 130" />
  </g>

  <text x="400" y="352" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="19" font-weight="600" letter-spacing="3.5" fill="#c7d2fe" fill-opacity="0.6">HTML  ·  TAILWIND CSS</text>

  <rect x="0" y="392" width="800" height="8" fill="url(#bar)" opacity="0.9"/>
